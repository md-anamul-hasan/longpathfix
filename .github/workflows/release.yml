name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') { $ver = $Matches[1] } else { throw "Missing version" }
          if ($tag -ne $ver) { throw "Tag v$tag does not match Cargo.toml version $ver" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install and build frontend
        working-directory: src-ui
        run: |
          npm ci
          npm run build

      - name: Run release-gate tests
        run: cargo test --workspace --all-targets --locked

      - name: Package Windows installer & portable zip
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 -SkipFrontendBuild

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/LongPathFix-Setup-*.exe
            dist/release/LongPathFix-*-win64-portable.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
